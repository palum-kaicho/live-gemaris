<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- 専用CSSの読み込み -->

    <style>

      .palmu-bonus-page-container {
        width: 100%;
        max-width: 1125px;
        margin: 0 auto;
        padding-top: 0;
        padding-bottom: 40px;
      }
      .palmu-bonus-img {
        width: 100%;
        height: auto;
        display: block;
        border: none;
      }
    </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo-link">
        <img src="images/logo.png" alt="Gemaris Logo" class="logo">
      </a>
      <button class="hamburger" id="js-hamburger" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
<nav class="nav-menu" id="js-nav-menu">
  <ul class="nav-list">
    <li><a href="index.html" class="nav-link">TOP</a></li>
    <li><a href="index.html#palmu" class="nav-link">Palmu紹介</a></li>
    <li><a href="index.html#plan" class="nav-link">契約プラン</a></li>
    <li><a href="index.html#campaign" class="nav-link">キャンペーン</a></li>
    <li><a href="index.html#interview" class="nav-link">ライバーインタビュー</a></li>
    <li><a href="apply.html" class="nav-link btn-nav-cta pulse-anim">応募はこちら</a></li>
  </ul>
</nav>
    </div>
  </header>

<!-- メインコンテンツ（画像3連） -->
<main class="palmu-bonus-page-container">
    <!-- 1枚目 -->
    <div class="bonus-img-wrap">
      <img src="images/bonus.png" alt="Palmuキャンペーン報酬" class="palmu-bonus-img">
    </div>

    <!-- 2枚目 -->
    <div class="bonus-img-wrap">
      <img src="images/bonus02.png" alt="4つの特別ボーナス" class="palmu-bonus-img">
    </div>

    <!-- 3枚目（お問い合わせボタン） -->
    <div class="bonus-img-wrap" style="position: relative;">
      <img src="images/bonus03.png" alt="お問い合わせ" class="palmu-bonus-img" usemap="#bonus03-map" id="js-bonus03-img">
      <map name="bonus03-map" id="bonus03-map">
        <!-- お問い合わせボタン：メール起動に変更 -->
        <area shape="rect" coords="110,600,1015,790" href="mailto:info@live-gemaris.com?subject=【Palmuキャンペーン】お問い合わせ" alt="お問い合わせはこちら" class="map-link">
      </map>
    </div>
</main>

<footer class="footer">
    <div class="container">
      
      <div class="footer-links">
        <a href="index.html">TOP</a>
        <a href="support.html">サポート</a>
        <a href="plan.html">契約プラン</a>

      </div>

      <p class="copyright">© 2026 Gemaris LLC. All Rights Reserved.</p>
    </div>
</footer>

<!-- JavaScript -->
<script>
  /* ハンバーガーメニュー */
  const hamburger = document.getElementById('js-hamburger');
  const navMenu = document.getElementById('js-nav-menu');

  if (hamburger && navMenu) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    document.querySelectorAll('.nav-menu a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
      });
    });
  }

  /* 画像マップレスポンシブ処理 */
  const b3Img = document.getElementById('js-bonus03-img');
  const b3Area = document.querySelector('map[name="bonus03-map"] area');
  const b3OriginalWidth = 1125;
  const b3OriginalHeight = 1000;
  const b3OriginalCoords = [110, 600, 1015, 790];

  function resizeBonus03Map() {
    if (!b3Img || !b3Area) return;
    const rect = b3Img.getBoundingClientRect();
    const ratioX = rect.width / b3OriginalWidth;
    const ratioY = rect.height / b3OriginalHeight;
    const newCoords = [
      Math.round(b3OriginalCoords[0] * ratioX),
      Math.round(b3OriginalCoords[1] * ratioY),
      Math.round(b3OriginalCoords[2] * ratioX),
      Math.round(b3OriginalCoords[3] * ratioY)
    ];
    b3Area.setAttribute('coords', newCoords.join(','));
  }

  window.addEventListener('load', resizeBonus03Map);
  window.addEventListener('resize', resizeBonus03Map);
  if (b3Img) {
    b3Img.complete ? resizeBonus03Map() : b3Img.addEventListener('load', resizeBonus03Map);
  }
</script>

</body>
</html>
